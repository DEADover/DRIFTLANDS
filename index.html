<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DRIFTLANDS</title>
    <!--
      A favicon, inline, because the browser asks for /favicon.ico on every load
      and a hosted copy answered that with the only 404 on the page.

      SVG rather than a .ico for the reason everything else here is procedural:
      there is not one raster asset in this project and this is not going to be
      the first. It is the game in one glyph — a drift arc with the car at the
      end of it, laying the rubber it just came through.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d12'/%3E%3Cpath d='M11 47c9-24 25-33 42-30' stroke='%232fb8ff' stroke-width='6' stroke-linecap='round' fill='none' opacity='.55'/%3E%3Cpath d='M13 51c9-24 25-33 40-31' stroke='%2357e08a' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Crect x='42' y='11' width='17' height='11' rx='3' transform='rotate(14 50 16)' fill='%23f2f6fa'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d12; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; inset: 0; pointer-events: none; }

      /* ---------------------------------------------------------- title screen
         The world renders live behind this, so the backdrop is the actual game
         rather than a picture of it. The button also gives us the user gesture
         that WebAudio needs before an AudioContext may start. */
      #title {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; text-align: center;
        font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
        color: #fff;
        background:
          radial-gradient(ellipse at 50% 45%, rgba(8,12,18,.30) 0%, rgba(8,12,18,.78) 70%);
        backdrop-filter: blur(2px);
        transition: opacity .45s ease, visibility .45s;
      }
      #title.gone { opacity: 0; visibility: hidden; }

      #title h1 {
        font-size: clamp(46px, 9vw, 112px);
        font-weight: 900; letter-spacing: -.045em; line-height: 1.0;
        text-shadow: 0 6px 40px rgba(0,0,0,.65);
      }
      #title .sub {
        font-size: 12.5px; letter-spacing: .42em; text-transform: uppercase;
        opacity: .72; margin-top: 10px;
      }
      #play {
        pointer-events: auto; cursor: pointer;
        font: inherit; font-size: 17px; font-weight: 800; letter-spacing: .16em;
        text-transform: uppercase; color: #10141b;
        background: #fff; border: 0; border-radius: 999px;
        padding: 17px 54px;
        box-shadow: 0 10px 40px rgba(0,0,0,.5);
        transition: transform .14s ease, box-shadow .14s ease, background .14s;
      }
      #play:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 16px 50px rgba(0,0,0,.6); }
      #play:active { transform: translateY(0) scale(.99); }

      #title .keys {
        display: flex; gap: 22px; flex-wrap: wrap; justify-content: center;
        font-size: 12px; letter-spacing: .08em; opacity: .78; margin-top: 4px;
      }
      #title .keys b {
        display: inline-block; min-width: 26px; padding: 3px 7px; margin-right: 7px;
        border: 1px solid rgba(255,255,255,.35); border-radius: 5px;
        font-size: 11px; font-weight: 700;
      }
      #title .hint { font-size: 11.5px; opacity: .5; letter-spacing: .08em; }
      #title .hint a { color: #9ec7ff; }
          #addmusic {
        display:block; margin:14px auto 0; padding:7px 16px;
        background:none; border:1px solid rgba(255,255,255,.28); border-radius:999px;
        color:rgba(255,255,255,.72); font:inherit; font-size:13px; letter-spacing:.02em;
        cursor:pointer; transition:border-color .2s, color .2s;
      }
      #addmusic:hover { border-color:rgba(255,255,255,.6); color:#fff; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>

    <div id="title">
      <div>
        <h1>DRIFTLANDS</h1>
        <div class="sub">Alpine Meadows &middot; Stage 01</div>
      </div>
      <button id="play" type="button">Drive</button>
      <div class="keys">
        <span><b>W A S D</b>drive</span>
        <span><b>Space</b>handbrake</span>
        <span><b>R</b>reset</span>
        <span><b>M</b>map</span>
        <span><b>N</b>mute</span>
        <span><b>H</b>hide HUD</span>
        <span><b>[ ]</b>track</span>
        <span><b>P</b>pause music</span>
      </div>
      <button id="addmusic" type="button">Add music</button>
      <div class="hint">Chain drifts to score &middot; drop your own MP3s in <code>music/</code> &middot; <a href="/progress/index.html">build progress</a></div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <!--
      DOUBLE-CLICKING THIS FILE CANNOT WORK, AND USED TO FAIL SILENTLY.

      This is the DEVELOPMENT entry. It loads /src/main.js, which imports `three`
      by bare name — only Vite can resolve that, and only while it is serving.
      Opened straight off disk the browser refuses the script outright:

        Access to script at 'file:///src/main.js' from origin 'null'
        has been blocked by CORS policy

      ...and the page just sits there black, with the explanation hidden in a
      console the person who double-clicked it has no reason to open. The
      packaged build has no such problem — it is one self-contained file — so
      the fix is to say which file that is.

      The check keys on an EXTERNAL module script still being present: the
      packager replaces this tag with an inline one, so this block is inert in
      every build and only ever speaks in the source tree.
    -->
    <script>
      if (location.protocol === 'file:' && document.querySelector('script[type=module][src]')) {
        addEventListener('DOMContentLoaded', function () {
          document.body.innerHTML =
            '<div style="font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#dfe7ef;'
            + 'background:#0b0d12;position:fixed;inset:0;display:flex;align-items:center;'
            + 'justify-content:center;padding:40px"><div style="max-width:560px">'
            + '<div style="font-size:26px;font-weight:700;letter-spacing:.04em;margin-bottom:18px">'
            + 'This file is the source, not the game</div>'
            + '<p style="margin:0 0 16px">You have opened the development page directly from disk. '
            + 'It loads its code through a build tool, and a browser will not do that from a '
            + '<code>file://</code> address.</p>'
            + '<p style="margin:0 0 10px"><b>To play right now:</b> open '
            + '<code style="background:#182030;padding:2px 6px;border-radius:4px">'
            + 'release/DRIFTLANDS/index.html</code> — that one is a single self-contained file '
            + 'and works with a double click.</p>'
            + '<p style="margin:0 0 10px">Not there yet? Build it with '
            + '<code style="background:#182030;padding:2px 6px;border-radius:4px">'
            + 'node tools/package.mjs</code></p>'
            + '<p style="margin:0">Or run the dev server: '
            + '<code style="background:#182030;padding:2px 6px;border-radius:4px">npm run dev</code>'
            + '</p></div></div>';
        });
      }
    </script>
  </body>
</html>
